<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12343b">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dërgesat e ditës</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap">
<style>
:root{--bg:#f2f4f0;--card:#fff;--ink:#12343b;--mut:#5d7479;--line:#d9e0dc;--acc:#f2b705;--onacc:#12343b;--ok:#2f8f5b;--bad:#b3392f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1d20;--card:#172a2e;--ink:#e8efec;--mut:#8fa6aa;--line:#2a4046;--ok:#4cc58a;--bad:#f0877d}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Barlow,system-ui,sans-serif;max-width:640px;margin:0 auto;padding-bottom:90px}
h1,h2,button,.t{font-family:"Barlow Semi Condensed",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 14px 8px;z-index:5}
.dn{display:flex;align-items:center;gap:8px}
.dn h1{flex:1;margin:0;font-size:24px;font-weight:700;text-align:center;line-height:1.1}
.dn h1 small{display:block;font-size:14px;font-weight:500;color:var(--mut)}
.ic{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px}
.bar{height:6px;background:var(--line);border-radius:3px;margin:10px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.tabs{display:flex;gap:6px;margin-top:8px}
.tabs button{flex:1;padding:9px;border:0;border-radius:10px;background:transparent;color:var(--mut);font-size:17px;font-weight:600}
.tabs button.on{background:var(--ink);color:var(--bg)}
main{padding:6px 14px}
.stop{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:12px;padding:12px;margin:10px 0;display:flex;gap:10px}
.stop.done{border-left-color:var(--ok);opacity:.6}
.stop.done .nm{text-decoration:line-through}
.n{width:30px;height:30px;flex:none;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700}
.stop.done .n{background:var(--ok);color:#fff}
.b{flex:1;min-width:0}
.nm{font-size:19px;font-weight:600;font-family:"Barlow Semi Condensed",sans-serif}
.ad,.nt{color:var(--mut);font-size:15px;overflow-wrap:anywhere}
.nt{font-style:italic}
.tag{display:inline-block;font-size:13px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin-top:4px}
.act{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.act a,.act button{flex:1 1 auto;min-width:64px;text-align:center;text-decoration:none;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;font-weight:600}
.act .go{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.act .ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.mv{display:flex;flex-direction:column;gap:4px}
.mv button{width:34px;height:34px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.fab{position:fixed;right:max(14px,calc(50% - 306px));bottom:calc(16px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px;border-radius:28px;border:0;background:var(--acc);color:var(--onacc);font-size:19px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.route{display:block;text-align:center;text-decoration:none;background:var(--ink);color:var(--bg);padding:13px;border-radius:12px;font-weight:700;font-size:18px;margin:8px 0}
dialog{border:0;border-radius:16px;padding:16px;width:min(94vw,520px);background:var(--card);color:var(--ink);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:15px}
input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days{display:flex;gap:4px}.days button{flex:1;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700}
.days button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
.fr{display:flex;gap:8px;margin-top:16px}.fr button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;font-weight:700}
.fr .sv{background:var(--ink);color:var(--bg)}.fr .del{color:var(--bad);flex:0 0 auto}
.pi{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.pi input{width:22px;height:22px;flex:none}.pi .b{flex:1}.pi.in{opacity:.5}
input[type=search]{font-size:16px}
.row{display:flex;gap:6px}.row input{flex:1;min-width:0}
.mapbtn{flex:none;padding:0 12px;border-radius:10px;border:0;background:var(--acc);color:var(--onacc);font-weight:700;font-size:16px}
.hint{font-size:14px;color:var(--mut);margin-top:4px}.hint.okk{color:var(--ok);font-weight:600}.hint.bad{color:var(--bad);font-weight:700}
.sug{width:100%;border:0;background:var(--acc);color:var(--onacc);font-size:18px;cursor:pointer}
#op-b ol{padding-left:22px;margin:8px 0}
select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}#op-b li{margin:5px 0}#op-b .big{font-size:18px;font-weight:700;margin:8px 0}
.mv,.sug{display:none!important}
</style>
</head>
<body>
<header>
  <div class="dn">
    <button class="ic" id="prev" aria-label="Dita e mëparshme">‹</button>
    <h1 id="title"></h1>
    <button class="ic" id="next" aria-label="Dita tjetër">›</button>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="hint" id="sync" style="text-align:center;margin:2px 0 0"></div>
  <div class="tabs"><button id="t1" class="on">Dita</button><button id="t2">Vendet</button></div>
</header>
<main id="list"></main>
<button class="fab" id="add">+ Shto në ditë</button>

<dialog id="pick">
  <h2 style="margin:0 0 8px;font-size:22px" id="pk-t">Zgjidh vendet</h2>
  <input id="pk-q" type="search" placeholder="Kërko emër ose adresë…" autocomplete="off">
  <div id="pk-l" style="margin:8px 0;max-height:32vh;overflow:auto"></div>
  <div style="border-top:1px solid var(--line);padding-top:8px">
    <div class="t" style="font-weight:700;font-size:18px">Vend vetëm për këtë ditë</div>
    <input id="tp-n" placeholder="Emri (opsionale)" autocomplete="off" style="margin-top:6px">
    <div class="row" style="margin-top:6px"><input id="tp-l" placeholder="Ngjit linkun ose koordinatat" autocomplete="off"><a class="mapbtn" id="tp-m" target="_blank" rel="noopener" href="https://www.google.com/maps" style="display:grid;place-items:center;text-decoration:none">Hap Maps</a></div>
    <div class="hint" id="tp-s"></div>
    <button type="button" class="mapbtn" id="tp-ok" style="width:100%;margin-top:6px;height:44px">Shto vetëm sot</button>
  </div>
  <div class="fr"><button id="pk-new">+ Vend i ri</button><button id="pk-x">Mbyll</button><button class="sv" id="pk-ok">Shto</button></div>
</dialog>
<dialog id="shr">
  <h2 style="margin:0 0 8px;font-size:22px">Dërgo listën e ditës</h2>
  <textarea id="sh-t" rows="11" style="font-size:14px"></textarea>
  <div class="row" style="margin-top:8px"><a class="mapbtn" id="sh-wa" target="_blank" rel="noopener" style="flex:1;height:44px;display:grid;place-items:center;text-decoration:none">WhatsApp</a><a class="mapbtn" id="sh-vb" target="_blank" rel="noopener" style="flex:1;height:44px;display:grid;place-items:center;text-decoration:none">Viber</a></div>
  <div class="row" style="margin-top:6px"><button type="button" class="mapbtn" id="sh-cp" style="flex:1;height:44px">Kopjo</button><button type="button" class="mapbtn" id="sh-sh" style="flex:1;height:44px">Shpërndaj</button></div>
  <div class="hint" id="sh-s"></div>
  <div class="fr"><button id="sh-x">Mbyll</button></div>
</dialog>
<dialog id="opt">
  <h2 style="margin:0 0 6px;font-size:22px">Rruga e sugjeruar</h2>
  <div id="op-b"></div>
  <div class="fr"><button id="op-x">Mbyll</button><button class="sv" id="op-ok">Zbato rendin</button></div>
</dialog>
<dialog id="dlg">
  <h2 id="dt" style="margin:0 0 4px;font-size:22px">Vend i ri</h2>
  <label>Emri / Klienti</label><input id="f-name" autocomplete="off">
  <label>Adresa</label><input id="f-addr" autocomplete="off" placeholder="Rruga, qyteti">
  <label>Pozicioni nga Google Maps</label>
  <div class="row"><input id="f-link" placeholder="Ngjit linkun ose koordinatat" autocomplete="off"><a class="mapbtn" id="f-maps" target="_blank" rel="noopener" href="https://www.google.com/maps" style="display:grid;place-items:center;text-decoration:none">Hap Maps</a></div>
  <div class="hint" id="f-st"></div>
  <button type="button" id="f-gps" class="mapbtn" style="width:100%;margin-top:8px;height:44px">Ruaj pozicionin tim aktual (jam këtu)</button>
  <label>Telefoni</label><input id="f-tel" type="tel">
  <label>Shënim (kodi i portës, kati, orari…)</label><textarea id="f-note" rows="2"></textarea>
  <div class="fr"><button class="del" id="f-del" hidden>Fshi</button><button id="f-cancel">Anulo</button><button class="sv" id="f-save">Ruaj</button></div>
</dialog>

<script>
var DN=["E diel","E hënë","E martë","E mërkurë","E enjte","E premte","E shtunë"];
var MN=["janar","shkurt","mars","prill","maj","qershor","korrik","gusht","shtator","tetor","nëntor","dhjetor"];
var db={places:[],plans:{},done:{},seq:1};
try{var raw=localStorage.getItem("dergesat");if(raw){var o=JSON.parse(raw);
  if(o.stops){o.places=o.stops.map(function(x){return{id:x.id,name:x.name,addr:x.addr,tel:x.tel,note:x.note}});o.plans=o.plans||{};
    o.stops.forEach(function(x){if(x.kind==="once"&&x.date){(o.plans[x.date]=o.plans[x.date]||[]).push(x.id)}});delete o.stops}
  db=o}}catch(e){}
function save(){try{localStorage.setItem("dergesat",JSON.stringify(db))}catch(e){}if(typeof syncOut==="function")syncOut()}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var cur=new Date();cur.setHours(12,0,0,0);
var tab=1,editId=null,addAfter=false,sel={},q="";
var $=function(i){return document.getElementById(i)};
function esc(t){return String(t||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function byId(id){return db.places.filter(function(s){return s.id==id})[0]}
function dayIds(){var k=iso(cur);return db.plans[k]=db.plans[k]||[]}
function forDay(){return dayIds().map(byId).filter(Boolean)}
function isDone(id){return !!(db.done[iso(cur)]||{})[id]}
function match(s,t){t=t.toLowerCase();return !t||(s.name+" "+s.addr).toLowerCase().indexOf(t)>-1}
function render(){
  var today=iso(new Date())===iso(cur),h="",items;
  $("title").innerHTML=tab===1?DN[cur.getDay()]+", "+cur.getDate()+" "+MN[cur.getMonth()]+"<small>"+(today?"Sot":cur.getFullYear())+"</small>":"Vendet e ruajtura<small>"+db.places.filter(function(s){return !s.temp}).length+" vende</small>";
  $("t1").className=tab===1?"on":"";$("t2").className=tab===2?"on":"";
  $("prev").style.visibility=$("next").style.visibility=tab===1?"visible":"hidden";
  $("add").textContent=tab===1?"+ Shto në ditë":"+ Vend i ri";
  if(tab===1){
    items=forDay();
    var nd=items.filter(function(s){return isDone(s.id)}).length;
    $("prog").style.width=items.length?(nd/items.length*100)+"%":"0";
    if(!items.length)h='<div class="empty">Asnjë dërgesë për këtë ditë.<br>Shtyp “+ Shto në ditë” dhe zgjidh nga vendet e ruajtura.</div>';
    else{
      var todo=items.filter(function(s){return !isDone(s.id)&&(s.addr||s.lat!=null)});
      if(items.length>1)h+='<button class="route sug" data-a="sug">Sugjero rrugën më të mirë</button>';
      if(todo.length){var ps=routeParts(todo);ps.forEach(function(p,k){h+='<a class="route" target="_blank" rel="noopener" href="'+mapsUrl(p.ch,p.back,p.origin)+'">'+(ps.length>1?'Rruga: pjesa '+(k+1)+' nga '+ps.length+' (ndalesat '+p.from+'–'+p.to+')':'Hap rrugën në Maps ('+todo.length+' ndalesa)')+'</a>'})}
      h+='<button class="route" data-a="share" style="width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer">Dërgo listën e ditës</button>';h+=mapSvg(items);
      h+='<div class="t" style="color:var(--mut);margin:4px 2px">'+nd+' nga '+items.length+' të kryera</div>';
      items.forEach(function(s,i){h+=card(s,i,true,i===0,i===items.length-1)});
    }
  }else{
    $("prog").style.width="0";
    h='<input type="search" id="sq" placeholder="Kërko në vendet e ruajtura…" value="'+esc(q)+'" style="margin:6px 0">';
    items=db.places.filter(function(s){return !s.temp&&match(s,q)}).sort(function(a,b){return a.name.localeCompare(b.name)});
    if(!db.places.length)h+='<div class="empty">Nuk ke asnjë vend të ruajtur ende.<br>Shtyp “+ Vend i ri”.</div>';
    items.forEach(function(s,i){h+=card(s,i,false)});
  }
  $("list").innerHTML=h;
  var sq=$("sq");if(sq){sq.oninput=function(){q=sq.value;var p=sq.selectionStart;render();var n=$("sq");n.focus();n.setSelectionRange(p,p)}}
}
function card(s,i,day,first,last){
  var q2=encodeURIComponent(s.lat!=null?s.lat+","+s.lng:(s.addr||s.name)),a='<div class="act">';
  if(day){a+='<button class="ok" data-a="done" data-id="'+s.id+'">'+(isDone(s.id)?"Ktheje":"Kryer ✓")+'</button>'}
  else{var inD=dayIds().indexOf(s.id)>-1;a+='<button class="go" data-a="addday" data-id="'+s.id+'"'+(inD?" disabled":"")+'>'+(inD?"Është në ditë":"Shto në "+cur.getDate()+" "+MN[cur.getMonth()])+'</button>'}
  if(s.addr||s.lat!=null)a+='<a '+(day?'class="go" ':'')+'target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+q2+'">Navigo</a>';
  if(s.tel)a+='<a href="tel:'+esc(s.tel)+'">Telefono</a>';
  a+='<button data-a="edit" data-id="'+s.id+'">Ndrysho</button>';
  if(day)a+='<button data-a="rm" data-id="'+s.id+'">Hiqe</button>';
  a+='</div>';
  return '<div class="stop'+(day&&isDone(s.id)?" done":"")+'">'+(day?'<div class="n">'+(i+1)+'</div>':'')
    +'<div class="b"><div class="nm">'+esc(s.name)+'</div><div class="ad">'+esc(s.addr)+'</div>'+(s.note?'<div class="nt">'+esc(s.note)+'</div>':'')+(day&&s.lat==null?'<div class="hint">⚠ Pa pozicion nga Maps: nuk renditet automatikisht</div>':'')+a+'</div>'
    +(day?'<div class="mv"><button data-a="up" data-id="'+s.id+'"'+(first?" disabled":"")+' aria-label="Sus">▲</button><button data-a="dn" data-id="'+s.id+'"'+(last?" disabled":"")+' aria-label="Poshtë">▼</button></div>':'')+'</div>';
}
$("list").addEventListener("click",function(e){
  var b=e.target.closest("button[data-a]");if(!b)return;
  var id=+b.dataset.id,a=b.dataset.a,k=iso(cur),l=dayIds();
  if(a==="done"){db.done[k]=db.done[k]||{};db.done[k][id]=db.done[k][id]?0:Date.now()}
  else if(a==="sug"){suggest(b);return}
  else if(a==="share"){openShare();return}
  else if(a==="edit"){openDlg(byId(id));return}
  else if(a==="addday"){if(l.indexOf(id)<0)l.push(id)}
  else if(a==="rm"){l.splice(l.indexOf(id),1)}
  else{var i=l.indexOf(id),j=a==="up"?i-1:i+1;if(j<0||j>=l.length)return;var t=l[i];l[i]=l[j];l[j]=t}
  save();render();
});
$("prev").onclick=function(){cur.setDate(cur.getDate()-1);render()};
$("next").onclick=function(){cur.setDate(cur.getDate()+1);render()};
$("t1").onclick=function(){tab=1;render()};$("t2").onclick=function(){tab=2;render()};
$("add").onclick=function(){if(tab===1)openPick();else{addAfter=false;openDlg(null)}};
function openPick(){sel={};$("tp-n").value="";$("tp-l").value="";$("tp-s").textContent="";$("pk-q").value="";$("pk-t").textContent="Zgjidh vendet për "+cur.getDate()+" "+MN[cur.getMonth()];drawPick();$("pick").showModal()}
function drawPick(){
  var l=dayIds(),items=db.places.filter(function(s){return !s.temp&&match(s,$("pk-q").value)}).sort(function(a,b){return a.name.localeCompare(b.name)});
  $("pk-l").innerHTML=items.length?items.map(function(s){var inD=l.indexOf(s.id)>-1;
    return '<label class="pi'+(inD?" in":"")+'" style="margin:0"><input type="checkbox" data-id="'+s.id+'"'+(inD?" checked disabled":(sel[s.id]?" checked":""))+'><div class="b"><div class="nm">'+esc(s.name)+'</div><div class="ad">'+esc(s.addr)+'</div></div></label>'}).join(""):'<div class="empty">Asnjë vend. Shtyp “+ Vend i ri”.</div>';
  var n=Object.keys(sel).length;$("pk-ok").textContent=n?"Shto ("+n+")":"Shto"}
$("pk-q").oninput=drawPick;
$("pk-l").addEventListener("change",function(e){var c=e.target;if(c.dataset.id){if(c.checked)sel[c.dataset.id]=1;else delete sel[c.dataset.id];drawPick()}});
$("pk-x").onclick=function(){$("pick").close()};
$("pk-ok").onclick=function(){var l=dayIds(),n=0;Object.keys(sel).forEach(function(id){if(l.indexOf(+id)<0){l.push(+id);n++}});
  if($("tp-l").value.trim()){if(!addTemp())return;n++}
  if(!n){$("tp-s").textContent="Zgjidh të paktën një vend nga lista, ose ngjit link/koordinata.";return}
  try{save()}catch(e){fail(e)}$("pick").close();render()};
$("pk-new").onclick=function(){$("pick").close();addAfter=true;openDlg(null)};
function openDlg(s){
  editId=s?s.id:null;$("dt").textContent=s?"Ndrysho vendin":"Vend i ri";
  $("f-name").value=s?s.name:"";$("f-addr").value=s?s.addr:"";$("f-tel").value=s?s.tel:"";$("f-note").value=s?s.note:"";
  pLat=s&&s.lat!=null?s.lat:null;pLng=s&&s.lat!=null?s.lng:null;$("f-link").value="";
  showSt();resetDel();$("f-del").hidden=!s;$("dlg").showModal();
}
var pLat=null,pLng=null,HINT="Më e sigurta: në Maps shtyp gjatë mbi vendin që do, pastaj shtyp koordinatat që shfaqen (p.sh. 41.3275, 19.8187) që të kopjohen, dhe ngjiti këtu. Ose shtyp butonin poshtë nëse je fizikisht aty.";
function showSt(msg,ok){var e=$("f-st");if(msg){e.textContent=msg;e.className="hint"+(ok?" okk":"");return}
  if(pLat!=null){e.textContent="✓ Pozicioni i ruajtur: "+(+pLat).toFixed(5)+", "+(+pLng).toFixed(5);e.className="hint okk"}else{e.textContent=HINT;e.className="hint"}}
function parseMaps(t){
  t=(t||"").trim();if(!t){showSt();return}
  var u=t;try{u=decodeURIComponent(t.replace(/\+/g," "))}catch(e){}
  var dm=u.match(/(\d+)°\s*(\d+)['′]\s*([\d.]+)["″]?\s*([NS])[,\s]+(\d+)°\s*(\d+)['′]\s*([\d.]+)["″]?\s*([EW])/i),dd=dm?[0,(dm[4].toUpperCase()=="S"?-1:1)*(+dm[1]+dm[2]/60+dm[3]/3600),(dm[8].toUpperCase()=="W"?-1:1)*(+dm[5]+dm[6]/60+dm[7]/3600)]:null;

  db.places=db.places.filter(function(s){return s.id!==editId});for(var k in db.plans)db.plans[k]=db.plans[k].filter(function(i){return i!==editId});save();$("dlg").close();render()}};
$("f-save").onclick=function(){
  var name=$("f-name").value.trim();if(!name){$("f-name").focus();return}
  var o={name:name,addr:$("f-addr").value.trim(),tel:$("f-tel").value.trim(),note:$("f-note").value.trim(),lat:pLat,lng:pLng};
  if(editId){var s=byId(editId);for(var k in o)s[k]=o[k]}
  else{o.id=newId();db.places.push(o);if(addAfter)dayIds().push(o.id)}
  save();$("dlg").close();render();
};
var SH=null,ready=true,lastP={},lastD={};
function newId(){return Date.now()*1000+Math.floor(Math.random()*1000)}
function setSync(t,ok,bad){var e=$("sync");e.textContent=t;e.className="hint"+(ok?" okk":"")+(bad?" bad":"")}
function fail(e){setSync("⚠ Nuk u ruajt në databazë ("+((e&&(e.code||e.message))||"gabim")+")"+(e&&e.code==="invalid_argument"?": ndoshta nuk ke leje për ndryshime (roli Contributor).":"."),0,1)}
function syncOut(){
  if(!SH||!ready)return;
  db.places.forEach(function(p){var j=JSON.stringify(p);if(lastP[p.id]!==j){lastP[p.id]=j;SH.doc("places/"+p.id).set(JSON.parse(j)).catch(fail)}});
  Object.keys(lastP).forEach(function(id){if(!db.places.some(function(p){return String(p.id)===id})){delete lastP[id];SH.doc("places/"+id).delete().catch(fail)}});
  var ks={};Object.keys(db.plans).forEach(function(k){ks[k]=1});Object.keys(db.done).forEach(function(k){ks[k]=1});
  Object.keys(ks).forEach(function(k){var d={ids:db.plans[k]||[],done:db.done[k]||{}},j=JSON.stringify(d);if(lastD[k]!==j){lastD[k]=j;SH.doc("days/"+k).set(d).catch(fail)}});
}
function initShared(){
  if(!window.claude||!claude.use){setSync("Modaliteti lokal (vetëm ky pajisje)");return}
  claude.use("db").then(function(d){
    if(!d){setSync("Modaliteti lokal (vetëm ky pajisje). Hap linkun duke qenë i kyçur në Claude për sinkronizim.");return}
    SH=d;ready=false;setSync("Po lidhem me databazën…");
    var local=JSON.parse(JSON.stringify(db)),gp=false,gd=false;
    function chk(){if(!(gp&&gd)||ready)return;ready=true;
      var imp=false;try{imp=!!localStorage.getItem("dergesat_imp")}catch(e){}
      if(!db.places.length&&!Object.keys(db.plans).length&&local.places&&local.places.length&&!imp){
        db.places=local.places;db.plans=local.plans||{};db.done=local.done||{};
        try{localStorage.setItem("dergesat_imp","1")}catch(e){}save()}
      setSync("● Sinkronizuar me të gjithë përdoruesit",true);render()}
    d.collection("places").onSnapshot(function(sn){
      var arr=[];lastP={};
      sn.docs.forEach(function(x){var v=x.data();if(v){var c=JSON.parse(JSON.stringify(v));arr.push(c);lastP[x.id]=JSON.stringify(c)}});
      db.places=arr;if(!(sn.metadata&&sn.metadata.fromCache))gp=true;if(ready)render();else chk()
    },function(){setSync("Gabim në sinkronizim.")});
    d.collection("days").onSnapshot(function(sn){
      db.plans={};db.done={};lastD={};
      sn.docs.forEach(function(x){var v=JSON.parse(JSON.stringify(x.data()||{}));db.plans[x.id]=v.ids||[];db.done[x.id]=v.done||{};lastD[x.id]=JSON.stringify({ids:db.plans[x.id],done:db.done[x.id]})});
      if(!(sn.metadata&&sn.metadata.fromCache))gd=true;if(ready)render();else chk()
    },function(){setSync("Gabim në sinkronizim.")});
  }).catch(function(){setSync("Modaliteti lokal (vetëm ky pajisje)")});
}

/* Supabase shim: i jep app-it të njëjtin interface "db" që kishte në Claude */
(function(){
  var URL_='https://kxesbwziuzyjoyobpgvw.supabase.co/rest/v1/kv';
  var H={apikey:'sb_publishable_WgVdMUOR7N9FgJJwz54VtA_4UAPrLuW','Content-Type':'application/json'};
  var pending=0,ver=0;
  function chk(r){if(!r.ok)return r.text().then(function(t){var e=new Error(r.status+" "+t.slice(0,80));e.code=r.status;throw e});return r}
  function w(p){pending++;ver++;return p.then(function(r){pending--;ver++;return r},function(e){pending--;ver++;throw e})}
  var polls=[];
  function pollAll(){polls.forEach(function(f){f()})}
  function mk(){return{
    doc:function(path){var a=path.split("/"),c=a[0],id=a[1];return{
      set:function(obj){return w(fetch(URL_+'?on_conflict=collection,id',{method:'POST',headers:Object.assign({Prefer:'resolution=merge-duplicates'},H),body:JSON.stringify({collection:c,id:id,data:obj,updated_at:new Date().toISOString()})}).then(chk))},
      delete:function(){return w(fetch(URL_+'?collection=eq.'+encodeURIComponent(c)+'&id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:H}).then(chk))}}},
    collection:function(c){return{onSnapshot:function(cb,errcb){
      var last=null;
      function poll(){
        if(document.hidden&&last!==null)return;
        var v=ver;
        fetch(URL_+'?collection=eq.'+encodeURIComponent(c)+'&select=id,data',{headers:H}).then(chk).then(function(r){return r.json()}).then(function(rows){
          if(pending>0||v!==ver)return;
          var j=JSON.stringify(rows);if(j===last)return;last=j;
          cb({metadata:{fromCache:false},docs:rows.map(function(x){return{id:x.id,data:function(){return x.data}}})});
        }).catch(function(){if(last===null&&errcb)errcb()});
      }
      polls.push(poll);poll();setInterval(poll,5000);
      document.addEventListener("visibilitychange",function(){if(!document.hidden)poll()});
      return function(){};
    }}}
  }}
  window.claude={use:function(n){return Promise.resolve(n==="db"?mk():null)}};
})();
initShared();
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
