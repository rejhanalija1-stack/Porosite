<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Rruga e Porosive</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171a;--mu:#6b7280;--ac:#0f766e;--bd:#e3e6ea;--dg:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101214;--card:#1b1e22;--tx:#eceff2;--mu:#9aa3ad;--ac:#2dd4bf;--bd:#2c3137;--dg:#f87171}}
:root[data-theme="dark"]{--bg:#101214;--card:#1b1e22;--tx:#eceff2;--mu:#9aa3ad;--ac:#2dd4bf;--bd:#2c3137;--dg:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px}
h1{font-size:20px;margin:4px 0 14px}
h2{font-size:15px;margin:0 0 10px;color:var(--mu);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
input[type=text]{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;margin-bottom:8px}
button,a.btn{display:inline-block;border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--ac);color:#fff;text-decoration:none;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button,:root:not([data-theme="light"]) a.btn{color:#04201c}}
button.s{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.loc{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.loc:first-of-type{border-top:0}
.loc input{width:22px;height:22px;accent-color:var(--ac)}
.loc .n{flex:1}.loc small{color:var(--mu);display:block}
.x{background:none;color:var(--dg);padding:6px 10px;font-size:20px}
ol{padding-left:0;list-style:none;margin:0}
.st{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.st:first-child{border-top:0}
.num{background:var(--ac);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:13px;flex:none}
.mu{color:var(--mu);font-size:14px}
.big{width:100%;text-align:center;margin-top:10px}
</style>
</head>
<body>
<h1>📍 Rruga e Porosive</h1>

<div class="card">
<h2>Shto lokacion</h2>
<input type="text" id="nm" placeholder="Emri (p.sh. Klienti Ali)">
<input type="text" id="co" placeholder="Koordinata ose link Google Maps">
<div class="row">
<button id="add">Ruaj</button>
<button class="s" id="gps">Vendndodhja ime</button>
</div>
<p class="mu" id="msg" style="margin:8px 0 0">Në Google Maps shtyp gjatë në pikë dhe kopjo koordinatat (p.sh. 41.3275, 19.8187), ose ngjit linkun.</p>
</div>

<div class="card">
<h2>Lokacionet e ruajtura (<span id="cnt">0</span>) · zgjedh për rrugën</h2>
<div id="list"></div>
<label class="mu" style="display:flex;gap:8px;margin-top:10px;align-items:center"><input type="checkbox" id="usegps" checked> Nis nga vendndodhja ime aktuale</label>
<button class="big" id="go">Gjej rrugën më të shkurtër</button>
</div>

<div class="card" id="res" hidden>
<h2>Rendi i dërgesave</h2>
<ol id="steps"></ol>
<p id="tot" style="font-weight:700"></p>
<a class="btn big" id="gm" target="_blank" rel="noopener">Hap në Google Maps</a>
<p class="mu" id="warn"></p>
</div>

<script>
const $=id=>document.getElementById(id);
let locs=[],sel=new Set();
try{locs=JSON.parse(localStorage.getItem('locs')||'[]')}catch(e){}
function save(){try{localStorage.setItem('locs',JSON.stringify(locs))}catch(e){}}
function parse(s){
  const m=s.match(/(-?\d{1,3}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)/);
  return m?{lat:+m[1],lng:+m[2]}:null;
}
function render(){
  $('cnt').textContent=locs.length;
  $('list').innerHTML=locs.length?'':'<p class="mu">Ende pa lokacione.</p>';
  locs.forEach((l,i)=>{
    const d=document.createElement('div');d.className='loc';
    d.innerHTML='<input type="checkbox"'+(sel.has(l.id)?' checked':'')+'><div class="n"></div><button class="x" aria-label="Fshi">×</button>';
    d.querySelector('.n').innerHTML='<b></b><small></small>';
    d.querySelector('b').textContent=l.name;
    d.querySelector('small').textContent=l.lat.toFixed(5)+', '+l.lng.toFixed(5);
    d.querySelector('input').onchange=e=>{e.target.checked?sel.add(l.id):sel.delete(l.id)};
    d.querySelector('.x').onclick=()=>{if(confirm('Fshi "'+l.name+'"?')){locs.splice(i,1);sel.delete(l.id);save();render()}};
    $('list').appendChild(d);
  });
}
$('add').onclick=()=>{
  const n=$('nm').value.trim(),c=parse($('co').value);
  if(!n||!c){$('msg').textContent='Shkruaj emrin dhe koordinata të vlefshme.';return}
  locs.push({id:Date.now()+'',name:n,...c});save();render();
  $('nm').value='';$('co').value='';$('msg').textContent='U ruajt ✓';
};
function getPos(){return new Promise(r=>{
  if(!navigator.geolocation)return r(null);
  navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lng:p.coords.longitude}),()=>r(null),{timeout:8000,enableHighAccuracy:true});
})}
$('gps').onclick=async()=>{
  $('msg').textContent='Po marr vendndodhjen…';
  const p=await getPos();
  if(p){$('co').value=p.lat.toFixed(6)+', '+p.lng.toFixed(6);$('msg').textContent='Vendndodhja u mor. Shkruaj emrin dhe shtyp Ruaj.'}
  else $('msg').textContent='Nuk u mor vendndodhja. Lejo qasjen në GPS.';
};
function hav(a,b){
  const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);
  const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function solve(start,pts){
  // nearest neighbour, then 2-opt (start fixed at index 0)
  let rest=pts.slice(),path=[start];
  while(rest.length){
    const last=path[path.length-1];let bi=0;
    rest.forEach((p,i)=>{if(hav(last,p)<hav(last,rest[bi]))bi=i});
    path.push(rest.splice(bi,1)[0]);
  }
  let imp=true;
  while(imp){imp=false;
    for(let i=1;i<path.length-1;i++)for(let j=i+1;j<path.length;j++){
      const a=path[i-1],b=path[i],c=path[j],d=path[j+1];
      const old=hav(a,b)+(d?hav(c,d):0),nw=hav(a,c)+(d?hav(b,d):0);
      if(nw<old-1e-9){path=path.slice(0,i).concat(path.slice(i,j+1).reverse(),path.slice(j+1));imp=true}
    }
  }
  return path;
}
$('go').onclick=async()=>{
  const pts=locs.filter(l=>sel.has(l.id));
  if(!pts.length){alert('Zgjidh të paktën një lokacion.');return}
  let start=null;
  if($('usegps').checked){$('go').textContent='Po llogaris…';start=await getPos();$('go').textContent='Gjej rrugën më të shkurtër'}
  const gpsOk=!!start;
  let path;
  if(gpsOk)path=solve({...start,name:'Nisja (ti)'},pts);
  else{path=solve(pts[0],pts.slice(1))}
  let tot=0;$('steps').innerHTML='';
  path.forEach((p,i)=>{
    const leg=i?hav(path[i-1],p):0;tot+=leg;
    const li=document.createElement('li');li.className='st';
    li.innerHTML='<span class="num"></span><div><b></b><div class="mu"></div></div>';
    li.querySelector('.num').textContent=i===0&&gpsOk?'●':(gpsOk?i:i+1);
    li.querySelector('b').textContent=p.name;
    li.querySelector('.mu').textContent=i?('+'+leg.toFixed(1)+' km në vijë të drejtë'):(gpsOk?'Pika e nisjes':'Pika e parë');
    $('steps').appendChild(li);
  });
  $('tot').textContent='Gjithsej ≈ '+tot.toFixed(1)+' km (në vijë të drejtë)';
  const stops=gpsOk?path.slice(1):path;
  const f=p=>p.lat+','+p.lng;
  const dest=stops[stops.length-1],way=stops.slice(gpsOk?0:1,-1).slice(0,9);
  let u='https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+f(dest);
  if(!gpsOk&&stops.length>1)u+='&origin='+f(stops[0]);
  if(way.length)u+='&waypoints='+way.map(f).join('|');
  $('gm').href=u;
  $('warn').textContent=(stops.length>10?'Google Maps merr deri në 9 ndalesa të ndërmjetme; u përfshinë të parat. ':'')+(gpsOk?'':'GPS nuk u përdor: rruga nis nga lokacioni i parë i zgjedhur.');
  $('res').hidden=false;$('res').scrollIntoView({behavior:'smooth'});
};
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
