<style>
/* Antracit theme (antracit.net): Urbanist titles, Work Sans text, teal #43c0af, anthracite #323e49,
   warm off-white header #fbfaf7, pill buttons and fields (35px), 10px cards. */
:root{
  --bg:#f4f5f7;--head:#fbfaf7;--foot:#e9ebef;--card:#fff;
  --ink:#242424;--text:#333;--mut:#767676;
  --line:#e9ebef;--field:rgba(0,0,0,.12);--soft:#f3f4f5;--soft-h:#e9ebee;
  --acc:#43c0af;--acc-h:#36ad9d;--acc-ink:#1a7f72;--acc-soft:rgba(67,192,175,.14);--onacc:#fff;
  --alt:#323e49;--alt-h:#27313b;--onalt:#fff;--logo:#323e49;
  --bad:#d64545;--bad-soft:rgba(214,69,69,.1);
  --r:10px;--pill:35px;
  --sh:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05);
  --sh-pop:0 24px 60px rgba(16,24,40,.24);
  --ft:"Urbanist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fb:"Work Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#13181d;--head:#1a2026;--foot:#1a2026;--card:#1f262d;
  --ink:#f1f3f4;--text:#d5dadf;--mut:#9aa5af;
  --line:#2b343d;--field:rgba(255,255,255,.16);--soft:#29323b;--soft-h:#323c46;
  --acc-ink:#5fd3c3;--acc-soft:rgba(67,192,175,.17);
  --alt:#3d4a57;--alt-h:#485767;--logo:#e8ecef;
  --bad:#f07c7c;--bad-soft:rgba(240,124,124,.13);
  --sh:0 1px 2px rgba(0,0,0,.35);--sh-pop:0 24px 60px rgba(0,0,0,.6);
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 160px)}
body{margin:0 auto;max-width:640px;min-height:100vh;background:var(--bg);color:var(--text);font:400 15px/1.55 var(--fb);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;z-index:30;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--head)}
h1,h2,.t,.nm{font-family:var(--ft);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
a,button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* sync status strip (antracit's teal top bar) */
#sync{padding:7px 14px;background:var(--alt);color:#fff;text-align:center;font:600 13px/1.35 var(--fb)}
#sync:empty{display:none}
#sync.okk{background:var(--acc);color:var(--onacc)}
#sync.bad{background:var(--bad)}

/* brand bar + sticky day header */
.brand{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 14px 8px;background:var(--head)}
.brand .logo{display:block;height:25px;width:auto;color:var(--logo)}
.brand span{padding-left:12px;border-left:1px solid var(--field);color:var(--mut);font:600 11px/1.6 var(--fb);letter-spacing:.16em;text-transform:uppercase}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:8px 14px 12px;background:var(--head);border-bottom:1px solid var(--line);box-shadow:0 8px 18px -14px rgba(16,24,40,.35)}
.dn{display:flex;align-items:center;gap:10px}
.dn h1{flex:1;margin:0;text-align:center;font-size:23px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.dn h1 small{display:block;margin-top:4px;color:var(--acc-ink);font:600 11px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase}
.ic{flex:none;display:grid;place-items:center;width:42px;height:42px;padding:0;border:0;border-radius:50%;background:var(--card);color:var(--ink);box-shadow:0 0 5px rgba(0,0,0,.17)}
.ic:hover{color:var(--acc-ink)}
.ic svg{width:20px;height:20px}
.bar{height:4px;margin:12px 0 0;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;width:0;height:100%;border-radius:4px;background:var(--acc);transition:width .3s}
.tabs{display:flex;gap:4px;margin-top:12px;padding:4px;border-radius:var(--pill);background:var(--soft)}
.tabs button{flex:1;padding:9px 10px;border:0;border-radius:var(--pill);background:transparent;color:var(--mut);font:700 15px/1.2 var(--ft)}
.tabs button.on{background:var(--alt);color:var(--onalt)}

/* list + cards */
main{padding:14px 14px 4px}
.stop{display:flex;gap:12px;margin:0 0 12px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--sh)}
.stop.done{opacity:.62}
.stop.done .nm{text-decoration:line-through;text-decoration-color:var(--mut)}
.n{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--alt);color:var(--onalt);font:700 15px/1 var(--ft)}
.stop.done .n{background:var(--acc);color:var(--onacc)}
.b{flex:1;min-width:0}
.nm{font-size:18px;font-weight:700;line-height:1.25}
.ad,.nt{color:var(--mut);font-size:14px;overflow-wrap:anywhere}
.ad{margin-top:2px}
.nt{margin-top:2px;font-style:italic}
.nm .tag{margin:0 0 0 6px;padding:1px 8px;vertical-align:2px;font-size:11px}
.tag{display:inline-block;margin-top:8px;padding:3px 11px;border-radius:var(--pill);background:var(--soft);color:var(--text);font:500 13px/1.35 var(--fb)}
.pay-tag b{color:var(--acc-ink);font-weight:600}
.pay-tag.paid{background:var(--acc-soft);color:var(--acc-ink)}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.act a,.act button{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;min-width:72px;min-height:42px;padding:9px 14px;border:0;border-radius:var(--pill);background:var(--soft);color:var(--text);font:600 14px/1.2 var(--fb);text-align:center;text-decoration:none;transition:background-color .15s,color .15s}
.act a:hover,.act button:hover{background:var(--soft-h)}
.act .go{background:var(--acc);color:var(--onacc)}
.act .go:hover{background:var(--acc-h)}
.act .ok{background:var(--alt);color:var(--onalt)}
.act .ok:hover{background:var(--alt-h)}
.stop.done .act .ok{background:var(--soft);color:var(--text)}
.act .paybtn{color:var(--acc-ink)}
.act .paybtn.paid{background:var(--acc-soft)}
.route{display:flex;align-items:center;justify-content:center;width:100%;margin:0 0 10px;padding:13px 20px;border:0;border-radius:var(--pill);background:var(--acc);color:var(--onacc);font:700 16px/1.3 var(--ft);text-align:center;text-decoration:none;box-shadow:0 8px 18px -8px rgba(67,192,175,.75)}
.route:hover{background:var(--acc-h)}
.route.sec{border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;box-shadow:none}
.route.sec:hover{background:var(--soft)}
.pay-sum{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin:0 0 12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--mut);font-size:14px}
.pay-sum strong{color:var(--acc-ink);font-weight:600}
.mapcard{display:block}
.mapcard .t{font-size:16px;font-weight:700}
#lmap{position:relative;z-index:0;height:240px;margin-top:10px;border-radius:var(--r);overflow:hidden;background:var(--soft)}
.mk{width:28px;height:28px;border:2px solid #fff;border-radius:50%;background:#323e49;color:#fff;font:700 13px/24px "Urbanist",sans-serif;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.mk.d{background:#43c0af}
.mk.dep{border-color:#323e49;background:#fff;color:#323e49}
.empty{padding:44px 16px;color:var(--mut);text-align:center;font-size:15px}
.empty::before{content:"";display:block;width:54px;height:54px;margin:0 auto 14px;background:url(icon.svg) center/contain no-repeat;opacity:.45}
.fab{position:fixed;z-index:9;right:max(14px,calc(50% - 306px));bottom:calc(18px + env(safe-area-inset-bottom,0px));height:54px;padding:0 24px;border:0;border-radius:var(--pill);background:var(--acc);color:var(--onacc);font:700 17px/1 var(--ft);box-shadow:0 12px 26px -8px rgba(67,192,175,.8),0 2px 6px rgba(0,0,0,.12)}
.fab:hover{background:var(--acc-h)}
.foot{margin-top:18px;padding:24px 14px calc(110px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--foot);color:var(--mut);text-align:center;font-size:13px}
.foot .logo{display:block;height:18px;width:auto;margin:0 auto 8px;color:var(--logo)}
#dil{margin-top:14px;padding:8px 24px;border:1px solid var(--field);border-radius:var(--pill);background:transparent;color:var(--text);font:600 14px/1.2 var(--fb)}
#dil:hover{background:var(--soft-h)}

/* dialogs + forms */
dialog{width:min(94vw,520px);max-height:92vh;padding:20px;border:0;border-radius:14px;background:var(--card);color:var(--text);box-shadow:var(--sh-pop)}
dialog::backdrop{background:rgba(20,26,32,.5);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
dialog h2{margin:0 0 12px;font-size:22px;font-weight:700;line-height:1.2}
label,.lbl{display:block;margin:12px 0 6px;color:var(--ink);font:600 14px/1.3 var(--fb)}
input:not([type=checkbox]):not([type=radio]),textarea,select{width:100%;min-height:44px;padding:10px 18px;border:1px solid var(--field);border-radius:var(--pill);background:var(--card);color:var(--text);font:400 16px/1.4 var(--fb);transition:border-color .15s,box-shadow .15s}
textarea{border-radius:16px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--mut);opacity:.85}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
input[type=checkbox]{accent-color:var(--acc)}
.fr{display:flex;gap:8px;margin-top:18px}
.fr button{flex:1;min-height:46px;padding:10px 14px;border:0;border-radius:var(--pill);background:var(--soft);color:var(--text);font:700 15px/1.2 var(--ft)}
.fr button:hover{background:var(--soft-h)}
.fr .sv{background:var(--acc);color:var(--onacc)}
.fr .sv:hover{background:var(--acc-h)}
.fr .del{flex:0 0 auto;background:transparent;color:var(--bad)}
.fr .del:hover{background:var(--bad-soft)}
.seg{display:flex;gap:4px;padding:4px;border-radius:var(--pill);background:var(--soft)}
.seg button{flex:1;min-height:40px;border:0;border-radius:var(--pill);background:transparent;color:var(--mut);font:600 15px/1.2 var(--fb)}
.seg button.on{background:var(--alt);color:var(--onalt)}
.seg #py-paid.on{background:var(--acc);color:var(--onacc)}
.plist{margin:10px 0;max-height:32vh;overflow:auto}
.pi{display:flex;align-items:center;gap:12px;margin:0;padding:10px 4px;border-bottom:1px solid var(--line);color:var(--text);font:400 15px/1.4 var(--fb);cursor:pointer}
.pi input{flex:none;width:22px;height:22px;margin:0}
.pi .nm{font-size:16px}
.pi.in{opacity:.5;cursor:default}
.plist .empty{padding:24px 8px}
.plist .empty::before{display:none}
.sub{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.sub-t{font-size:17px;font-weight:700}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.mt{margin-top:8px}
.grow{flex:1}
.mapbtn{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border:0;border-radius:var(--pill);background:var(--acc-soft);color:var(--acc-ink);font:600 14px/1.2 var(--fb);text-decoration:none;white-space:nowrap}
.mapbtn:hover{background:rgba(67,192,175,.24)}
.mapbtn.wide{width:100%;margin-top:8px}
.sub .mapbtn.wide{margin-top:0}
#sh-t{border-radius:14px;font-size:16px}
#sq{margin:0 0 12px}
.hint{margin-top:6px;color:var(--mut);font-size:13px;line-height:1.45}
.hint.okk{color:var(--acc-ink);font-weight:600}
.hint.bad{color:var(--bad);font-weight:600}
#toast{position:fixed;z-index:50;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:92vw;padding:11px 20px;border-radius:var(--pill);background:var(--alt);color:#fff;font:600 14px/1.3 var(--fb);width:max-content;text-align:center;box-shadow:0 10px 28px rgba(0,0,0,.25);opacity:0;pointer-events:none;transform:translate(-50%,8px);transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* license gate */
#gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--head);color:var(--text)}
#gate::before{content:"";position:absolute;top:0;left:0;right:0;height:calc(6px + env(safe-area-inset-top,0px));background:var(--acc)}
.g-box{width:100%;max-width:360px;text-align:center}
.g-box .logo{display:block;width:auto;height:34px;margin:0 auto 30px;color:var(--logo)}
.g-box h1{margin:0 0 6px;font-size:28px;font-weight:700}
.g-box p{margin:0 0 22px;color:var(--mut)}
#gcode{min-height:52px;margin-bottom:12px;text-align:center;font-size:18px;letter-spacing:.08em}
#gbtn{width:100%;min-height:52px;border:0;border-radius:var(--pill);background:var(--acc);color:var(--onacc);font:700 17px/1 var(--ft)}
#gbtn:hover{background:var(--acc-h)}
#gmsg{min-height:22px;margin-top:14px;color:var(--bad);font-weight:600}
.g-foot{margin-top:34px;color:var(--mut);font-size:11px;letter-spacing:.16em;text-transform:uppercase}

/* roles */
body.driver .tabs,body.driver #add,body.driver [data-a="edit"],body.driver [data-a="rm"]{display:none!important}
body.mgr #f-del{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="lg-full" viewBox="0 0 597 106">
    <path fill="#43c0af" d="M65 0 84 31.5 39.2 106H0Z"/>
    <g fill="currentColor"><path d="M84.5 51 117.5 106H79L65 83Z"/><path d="M146 93 175.5 33h5L210 93h-8l-24-49-24 49Z"/><path d="M217 93V33h2.85L257 76.7V33h8v60h-2.65L225 49.06V93Z"/><path d="M273 33h55v7h-24v53h-7V40h-24Z"/><path d="M336 33h7v60h-7Z"/><path d="M362.9 62.5h8L388.3 93h-8Z"/><path d="M394 93 423.5 33h5L458 93h-8l-24-49-24 49Z"/><path d="M525 33h7v60h-7Z"/><path d="M540 33h55v7h-24v53h-7V40h-24Z"/></g>
    <g fill="none" stroke="currentColor" stroke-width="7"><path d="M339.5 36.5H368.5A13 13 0 0 1 368.5 62.5H339.5"/><path d="M509 44A26.5 26.5 0 1 0 509 82"/></g>
  </symbol>
</svg>
<div id="sync" role="status" aria-live="polite"></div>
<div class="brand"><svg class="logo" viewBox="0 0 597 106" role="img" aria-label="Antracit"><use href="#lg-full"/></svg><span>Dërgesat</span></div>
<header>
  <div class="dn">
    <button class="ic" id="prev" type="button" aria-label="Dita e mëparshme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="title"></h1>
    <button class="ic" id="next" type="button" aria-label="Dita tjetër"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="tabs"><button id="t1" type="button" class="on" aria-pressed="true">Dita</button><button id="t2" type="button" aria-pressed="false">Vendet</button></div>
</header>
<main>
  <input id="sq" type="search" placeholder="Kërko në vendet e ruajtura…" autocomplete="off" aria-label="Kërko në vendet e ruajtura" hidden>
  <div id="list"></div>
</main>
<footer class="foot">
  <svg class="logo" viewBox="0 0 597 106" aria-hidden="true"><use href="#lg-full"/></svg>
  <div>Antracit · Prizren</div>
  <button id="dil" type="button">Dil</button>
</footer>
<button class="fab" id="add" type="button">+ Shto në ditë</button>

<dialog id="pick" aria-labelledby="pk-t">
  <h2 id="pk-t">Zgjidh vendet</h2>
  <input id="pk-q" type="search" placeholder="Kërko emër ose adresë…" autocomplete="off" aria-label="Kërko vendet">
  <div id="pk-l" class="plist"></div>
  <div class="sub">
    <div class="t sub-t">Vend vetëm për këtë ditë</div>
    <input id="tp-n" placeholder="Emri (opsionale)" autocomplete="off" aria-label="Emri">
    <input id="tp-a" type="text" inputmode="decimal" placeholder="Shuma € (opsionale)" autocomplete="off" aria-label="Shuma në euro">
    <div class="row"><input id="tp-l" placeholder="Ngjit linkun ose koordinatat" autocomplete="off" aria-label="Linku i Maps ose koordinatat"><a class="mapbtn" id="tp-m" target="_blank" rel="noopener" href="https://www.google.com/maps">Hap Maps</a></div>
    <div class="hint" id="tp-s"></div>
    <button type="button" class="mapbtn wide" id="tp-ok">Shto vetëm sot</button>
  </div>
  <div class="fr"><button type="button" id="pk-new">+ Vend i ri</button><button type="button" id="pk-x">Mbyll</button><button type="button" class="sv" id="pk-ok">Shto</button></div>
</dialog>
<dialog id="shr" aria-labelledby="sh-h">
  <h2 id="sh-h">Dërgo listën e ditës</h2>
  <textarea id="sh-t" rows="11" aria-label="Teksti i listës"></textarea>
  <div class="row mt"><a class="mapbtn grow" id="sh-wa" target="_blank" rel="noopener">WhatsApp</a><a class="mapbtn grow" id="sh-vb" target="_blank" rel="noopener">Viber</a></div>
  <div class="row mt"><button type="button" class="mapbtn grow" id="sh-cp">Kopjo</button><button type="button" class="mapbtn grow" id="sh-sh">Shpërndaj</button></div>
  <div class="hint" id="sh-s"></div>
  <div class="fr"><button type="button" id="sh-x">Mbyll</button></div>
</dialog>
<dialog id="dlg" aria-labelledby="dt">
  <h2 id="dt">Vend i ri</h2>
  <label for="f-name">Emri / Klienti</label><input id="f-name" autocomplete="off">
  <label for="f-addr">Adresa</label><input id="f-addr" autocomplete="off" placeholder="Rruga, qyteti">
  <label for="f-link">Pozicioni nga Google Maps</label>
  <div class="row"><input id="f-link" placeholder="Ngjit linkun ose koordinatat" autocomplete="off"><a class="mapbtn" id="f-maps" target="_blank" rel="noopener" href="https://www.google.com/maps">Hap Maps</a></div>
  <div class="hint" id="f-st"></div>
  <button type="button" id="f-gps" class="mapbtn wide">Ruaj pozicionin tim aktual (jam këtu)</button>
  <label for="f-tel">Telefoni</label><input id="f-tel" type="tel" autocomplete="off">
  <label for="f-amt">Shuma standarde (€, opsionale)</label><input id="f-amt" type="text" inputmode="decimal" autocomplete="off" placeholder="p.sh. 25.00">
  <label for="f-note">Shënim (kodi i portës, kati, orari…)</label><textarea id="f-note" rows="2"></textarea>
  <div class="fr"><button type="button" class="del" id="f-del" hidden>Fshi</button><button type="button" id="f-cancel">Anulo</button><button type="button" class="sv" id="f-save">Ruaj</button></div>

<script>
'use strict';

var MN=["janar","shkurt","mars","prill","maj","qershor","korrik","gusht","shtator","tetor","nëntor","dhjetor"];
var DEPOT={lat:42.2139,lng:20.7397,name:'Prizren'};
var LS_DB='dergesat',LS_BASE='dergesat_base',LS_IMP='dergesat_imp',LS_OWNER='dergesat_owner',LK='lic_code',RK='lic_role';
var API='https://kxesbwziuzyjoyobpgvw.supabase.co/rest/v1/rpc/';
var API_HEADERS={apikey:'sb_publishable_WgVdMUOR7N9FgJJwz54VtA_4UAPrLuW','Content-Type':'application/json'};
var LEAFLET_JS='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
var LEAFLET_SRI='sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==';
var HINT='Më e sigurta: në Maps shtyp gjatë mbi vendin që do, pastaj shtyp koordinatat që shfaqen (p.sh. 41.3275, 19.8187) që të kopjohen, dhe ngjiti këtu. Ose shtyp butonin poshtë nëse je fizikisht aty.';

/* ===== Helpers ===== */
var $=function(id){return document.getElementById(id)};
var store={
  get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del:function(k){try{localStorage.removeItem(k)}catch(e){}}
};
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uniq(a){return Array.from(new Set(a))}
function sortKeys(v){
  if(Array.isArray(v))return v.map(sortKeys);
  if(v&&typeof v==='object'){var o={};Object.keys(v).sort().forEach(function(k){if(v[k]!==undefined)o[k]=sortKeys(v[k])});return o}
  return v;
}
/* Stable JSON used to compare documents (key order independent). */
function canon(v){return v===undefined?undefined:JSON.stringify(sortKeys(v))}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function noon(d){var x=new Date(d);x.setHours(12,0,0,0);return x}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function dayLabel(d){return d.getDate()+' '+MN[d.getMonth()]}
function isDayKey(k){return /^\d{4}-\d{2}-\d{2}$/.test(k)}
function fmtEur(n){return Number(n||0).toFixed(2)+' €'}
/* "25", "25.5", "25,50" -> number; "" or "0" -> null; anything else -> NaN */
function parseAmt(v){
  v=String(v==null?'':v).replace(/[\s€]/g,'').replace(',','.');
  if(!v)return null;
  var n=Number(v);
  if(!isFinite(n)||n<0)return NaN;
  return n>0?Math.round(n*100)/100:null;
}
function fold(t){return String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
function match(s,t){t=fold(t).trim();return !t||fold(s.name+' '+(s.addr||'')+' '+(s.tel||'')).indexOf(t)>-1}
function byName(a,b){return a.name.localeCompare(b.name,'sq')}
function hash(s){var h=2166136261;s=String(s);for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function newId(){return Date.now()*1000+Math.floor(Math.random()*1000)}
function telHref(t){var d=String(t||'').replace(/[^\d+]/g,'');return d?'tel:'+d:''}
function num(v){if(v===null||v===undefined||v==='')return null;var n=Number(v);return isFinite(n)?n:null}
function str(v){return v==null?'':String(v).trim()}
function toast(msg){var el=$('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toast.tm);toast.tm=setTimeout(function(){el.classList.remove('on')},2800)}
function hintBad(el,msg){el.textContent=msg;el.className='hint bad'}

/* ===== Data model =====
   db.places: [{id,name,addr,tel,note,amt,lat,lng,temp?,deleted?}]
   db.plans[day]: [placeId...]   db.done[day][placeId]: timestamp   db.pay[day][placeId]: {amt,paid}
   On the server: collection "places" (one doc per place) and "days" (one doc per day: {ids,done,pay}). */
function normPlace(p){
  if(!p||typeof p!=='object')return null;
  var id=Number(p.id);
  if(!Number.isSafeInteger(id)||id<=0)return null;
  var lat=num(p.lat),lng=num(p.lng),amt=num(p.amt);
  if(lat==null||lng==null||Math.abs(lat)>90||Math.abs(lng)>180){lat=null;lng=null}
  var o={id:id,name:str(p.name)||'Pa emër',addr:str(p.addr),tel:str(p.tel),note:str(p.note),amt:amt>0?Math.round(amt*100)/100:null,lat:lat,lng:lng};
  if(p.temp)o.temp=true;
  if(p.deleted)o.deleted=true;
  return o;
}
function normDay(v){
  v=v&&typeof v==='object'?v:{};
  var ids=[],done={},pay={},d=v.done&&typeof v.done==='object'?v.done:{},p=v.pay&&typeof v.pay==='object'?v.pay:{};
  (Array.isArray(v.ids)?v.ids:[]).forEach(function(x){x=Number(x);if(Number.isSafeInteger(x)&&x>0&&ids.indexOf(x)<0)ids.push(x)});
  Object.keys(d).forEach(function(k){var t=Number(d[k]);if(/^\d+$/.test(k)&&t>0)done[k]=t});
  Object.keys(p).forEach(function(k){var e=p[k];if(/^\d+$/.test(k)&&e&&typeof e==='object'){var a=num(e.amt);pay[k]={amt:a>0?Math.round(a*100)/100:0,paid:!!e.paid}}});
  return {ids:ids,done:done,pay:pay};
}
function emptyDb(){return {places:[],plans:{},done:{},pay:{}}}
function loadDb(){
  var o=null;try{o=JSON.parse(store.get(LS_DB)||'null')}catch(e){}
  var d=emptyDb();
  if(!o||typeof o!=='object')return d;
  if(Array.isArray(o.stops)){ /* oldest format: one list of stops */
    o.places=o.stops.map(function(x){return {id:x.id,name:x.name,addr:x.addr,tel:x.tel,note:x.note}});o.plans=o.plans||{};
    o.stops.forEach(function(x){if(x.kind==='once'&&x.date)(o.plans[x.date]=o.plans[x.date]||[]).push(x.id)});
  }
  (Array.isArray(o.places)?o.places:[]).forEach(function(p){p=normPlace(p);if(p&&!d.places.some(function(q){return q.id===p.id}))d.places.push(p)});
  var plans=o.plans||{},done=o.done||{},pay=o.pay||{};
  uniq(Object.keys(plans).concat(Object.keys(done),Object.keys(pay))).filter(isDayKey).forEach(function(k){
    var v=normDay({ids:plans[k],done:done[k],pay:pay[k]});d.plans[k]=v.ids;d.done[k]=v.done;d.pay[k]=v.pay;
  });
  return d;
}
var db=loadDb();
function persist(){store.set(LS_DB,JSON.stringify(db))}
function save(){persist();syncOut(true)}
function byId(id){id=Number(id);for(var i=0;i<db.places.length;i++)if(db.places[i].id===id)return db.places[i];return null}
function visiblePlaces(){return db.places.filter(function(s){return !s.temp&&!s.deleted})}
function dayDoc(k){return {ids:db.plans[k]||[],done:db.done[k]||{},pay:db.pay[k]||{}}}
function setDay(k,v){if(!v){delete db.plans[k];delete db.done[k];delete db.pay[k];return}db.plans[k]=v.ids;db.done[k]=v.done;db.pay[k]=v.pay}
function dayKeys(){return uniq(Object.keys(db.plans).concat(Object.keys(db.done),Object.keys(db.pay))).filter(isDayKey)}
function isEmptyDay(v){return !v.ids.length&&!Object.keys(v.done).length&&!Object.keys(v.pay).length}
function planOf(k){return db.plans[k]||[]}                    /* read-only */
function planFor(k){return db.plans[k]=db.plans[k]||[]}      /* write path: creates the day */
function isDone(id,k){return !!(db.done[k||iso(cur)]||{})[id]}
function getPay(id,k){
  k=k||iso(cur);var dp=db.pay[k]&&db.pay[k][id];
  if(dp)return {amt:dp.amt>0?Number(dp.amt):null,paid:!!dp.paid};
  var s=byId(id);
  return s&&s.amt>0?{amt:Number(s.amt),paid:false}:{amt:null,paid:false};
}

/* ===== Route ordering (pure: never writes) ===== */
function hav(a,b){var R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r,x=Math.pow(Math.sin(dl/2),2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.pow(Math.sin(dn/2),2);return 2*R*Math.asin(Math.sqrt(x))}
function plen(st,p,en){var d=0,c=st;p.forEach(function(s){d+=hav(c,s);c=s});if(en)d+=hav(c,en);return d}
function opt(st,pts,en){
  var rest=pts.slice(),p=[],c=st;
  while(rest.length){var bi=0,bd=1e9;rest.forEach(function(s,i){var d=hav(c,s);if(d<bd){bd=d;bi=i}});c=rest.splice(bi,1)[0];p.push(c)}
  var imp=true,best=plen(st,p,en);
  while(imp){imp=false;for(var i=0;i<p.length-1;i++)for(var j=i+1;j<p.length;j++){var q=p.slice(0,i).concat(p.slice(i,j+1).reverse(),p.slice(j+1)),l=plen(st,q,en);if(l<best-1e-6){p=q;best=l;imp=true}}}
  return p;
}
/* Display order for a day: finished stops first (in the order they were done), then the
   shortest route from the last finished stop back to Prizren, then stops without a position. */
var orderMemo={sig:null,ids:[]};
function dayItems(k){
  k=k||iso(cur);
  var d=db.done[k]||{},items=planOf(k).map(byId).filter(Boolean);
  var sig=k+'|'+items.map(function(s){return s.id+':'+(s.lat==null?'-':s.lat+','+s.lng)+':'+(d[s.id]||0)}).join(';');
  if(orderMemo.sig!==sig){
    var done=items.filter(function(s){return d[s.id]}).sort(function(a,b){return Number(d[a.id])-Number(d[b.id])});
    var rem=items.filter(function(s){return !d[s.id]});
    var st=DEPOT;for(var i=done.length-1;i>=0;i--){if(done[i].lat!=null){st=done[i];break}}
    var ord=done.concat(opt(st,rem.filter(function(s){return s.lat!=null}),DEPOT),rem.filter(function(s){return s.lat==null}));
    orderMemo={sig:sig,ids:ord.map(function(s){return s.id})};
  }
  return orderMemo.ids.map(byId).filter(Boolean);
}
function loc(s){return s.lat!=null?s.lat+','+s.lng:s.addr}
function mapsUrl(ch,back,origin){var all=back?ch:ch.slice(0,-1),dest=back?DEPOT:ch[ch.length-1],wp=all.map(loc).join('|');return 'https://www.google.com/maps/dir/?api=1&travelmode=driving'+(origin?'&origin='+encodeURIComponent(origin):'')+'&destination='+encodeURIComponent(loc(dest))+(wp?'&waypoints='+encodeURIComponent(wp):'')}
/* Google Maps links accept at most 9 waypoints, so long days are split into parts. */
function routeParts(go){var out=[],i=0;while(i<go.length){var rem=go.length-i,last=rem<=8,n=last?rem:(rem===9?8:9);out.push({ch:go.slice(i,i+n),back:last,origin:i?loc(go[i-1]):null,from:i+1,to:i+n});i+=n}return out}

/* ===== Rendering ===== */
var cur=noon(new Date()),tab=1,editId=null,addAfter=false,sel={},q='',armAll=0,lastToday=iso(new Date());
function render(){
  var k=iso(cur),today=iso(new Date())===k,h='',list=$('list');
  var ae=document.activeElement,focus=ae&&ae.dataset&&ae.dataset.a&&list.contains(ae)?{a:ae.dataset.a,id:ae.dataset.id||''}:null;
  $('title').innerHTML=tab===1?esc(DN[cur.getDay()]+', '+dayLabel(cur))+'<small>'+(today?'Sot':cur.getFullYear())+'</small>':'Vendet e ruajtura<small>'+visiblePlaces().length+' vende</small>';
  $('t1').className=tab===1?'on':'';$('t2').className=tab===2?'on':'';
  $('t1').setAttribute('aria-pressed',String(tab===1));$('t2').setAttribute('aria-pressed',String(tab===2));
  $('prev').style.visibility=$('next').style.visibility=tab===1?'visible':'hidden';
  $('add').textContent=tab===1?'+ Shto në ditë':'+ Vend i ri';
  $('sq').hidden=tab!==2;
  if(tab===1){
    var items=dayItems(k),nd=items.filter(function(s){return isDone(s.id)}).length,remCount=items.length-nd;
    $('prog').style.width=items.length?(nd/items.length*100)+'%':'0';
    if(!items.length)h='<div class="empty">Asnjë dërgesë për këtë ditë.<br>Shtyp “+ Shto në ditë” dhe zgjidh nga vendet e ruajtura.</div>';
    else{
      var todo=items.filter(function(s){return !isDone(s.id)&&(s.addr||s.lat!=null)});
      if(todo.length){var ps=routeParts(todo);ps.forEach(function(p,i){h+='<a class="route" target="_blank" rel="noopener" href="'+esc(mapsUrl(p.ch,p.back,p.origin))+'">'+(ps.length>1?'Rruga: pjesa '+(i+1)+' nga '+ps.length+' (ndalesat '+p.from+'–'+p.to+(p.back?' + Prizren':'')+')':'Hap rrugën në Maps ('+todo.length+' ndalesa + kthimi në Prizren)')+'</a>'})}
      h+='<button type="button" class="route sec" data-a="share">Dërgo listën e ditës</button>';
      if(remCount>0)h+='<button type="button" class="route sec" data-a="tomorrow-all">'+(Date.now()-armAll<4000?'Prek përsëri për t\'i shtyrë ('+remCount+')':'Shtyji të pakryerat për nesër ('+remCount+')')+'</button>';
      if(items.some(function(s){return s.lat!=null}))h+='<div class="stop mapcard"><div class="t">Harta e ndalesave</div><div id="lmap"></div><div class="hint">● Prizreni (P) · numrat = radha · jeshile = të kryera. Zmadho me dy gishta. Për navigim shtyp “Hap rrugën në Maps”.</div></div>';
      var tot=0,paid=0;
      items.forEach(function(s){var p=getPay(s.id);if(p.amt>0){tot+=p.amt;if(p.paid)paid+=p.amt}});
      h+='<div class="pay-sum"><span>'+nd+' nga '+items.length+' të kryera</span>'+(tot>0?'<span>Arkëtuar: <strong>'+fmtEur(paid)+'</strong> / '+fmtEur(tot)+'</span>':'<span>Pagesat: '+fmtEur(0)+'</span>')+'</div>';
      items.forEach(function(s,i){h+=card(s,i,true)});
    }
  }else{
    $('prog').style.width='0';
    var all=visiblePlaces(),found=all.filter(function(s){return match(s,q)}).sort(byName);
    if(!all.length)h='<div class="empty">Nuk ke asnjë vend të ruajtur ende.<br>Shtyp “+ Vend i ri”.</div>';
    else if(!found.length)h='<div class="empty">Asnjë vend nuk përputhet me “'+esc(q)+'”.</div>';
    found.forEach(function(s){h+=card(s,0,false)});
  }
  list.innerHTML=h;
  if(focus){var n=list.querySelector('[data-a="'+CSS.escape(focus.a)+'"]'+(focus.id?'[data-id="'+CSS.escape(focus.id)+'"]':''));if(n)n.focus({preventScroll:true})}
  if(tab===1&&$('lmap'))initMap();
}
function card(s,i,day){
  var id=esc(s.id),done=day&&isDone(s.id),p=day?getPay(s.id):{amt:s.amt>0?Number(s.amt):null,paid:false},a='<div class="act">';
  if(day){
    a+='<button type="button" class="ok" data-a="done" data-id="'+id+'">'+(done?'Ktheje':'Kryer ✓')+'</button>';
    a+='<button type="button" class="paybtn'+(p.paid?' paid':'')+'" data-a="pay" data-id="'+id+'">'+(p.amt>0?fmtEur(p.amt)+(p.paid?' ✓':''):'Pagesa €')+'</button>';
  }else{
    var inD=planOf(iso(cur)).indexOf(s.id)>-1;
    a+='<button type="button" class="go" data-a="addday" data-id="'+id+'"'+(inD?' disabled':'')+'>'+(inD?'Është në ditë':'Shto në '+dayLabel(cur))+'</button>';
  }
  if(s.addr||s.lat!=null)a+='<a '+(day?'class="go" ':'')+'target="_blank" rel="noopener" href="'+esc('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(s.lat!=null?s.lat+','+s.lng:(s.addr||s.name)))+'">Navigo</a>';
  var tel=telHref(s.tel);if(tel)a+='<a href="'+esc(tel)+'">Telefono</a>';
  if(day&&!done)a+='<button type="button" data-a="tomorrow" data-id="'+id+'">Nesër ↪</button>';
  if(!s.deleted)a+='<button type="button" data-a="edit" data-id="'+id+'">Ndrysho</button>';
  if(day)a+='<button type="button" data-a="rm" data-id="'+id+'">Hiqe</button>';
  a+='</div>';
  var badge=p.amt>0?'<div><span class="tag pay-tag'+(day&&p.paid?' paid':'')+'"><b>'+fmtEur(p.amt)+'</b> · '+(day?(p.paid?'Paguar ✓':'Pa paguar'):'Standarde')+'</span></div>':'';
  return '<div class="stop'+(done?' done':'')+'">'+(day?'<div class="n">'+(i+1)+'</div>':'')
    +'<div class="b"><div class="nm">'+esc(s.name)+(s.deleted?'<span class="tag">I fshirë</span>':'')+'</div>'+(s.addr?'<div class="ad">'+esc(s.addr)+'</div>':'')+(s.note?'<div class="nt">'+esc(s.note)+'</div>':'')+badge
    +(day&&s.lat==null?'<div class="hint">⚠ Pa pozicion nga Maps: nuk renditet automatikisht</div>':'')+a+'</div></div>';
}

/* ===== Day actions ===== */
function pushToTomorrow(id,k,nk){
  var nl=planFor(nk);if(nl.indexOf(id)<0)nl.push(id);
  var tp=db.pay[k]&&db.pay[k][id];
  if(tp){
    var dp=db.pay[nk]=db.pay[nk]||{},np=dp[id];
    /* Keep both records' information: an amount from either day and "paid" if either was paid. */
    dp[id]=np?{amt:np.amt>0?np.amt:tp.amt,paid:!!(np.paid||tp.paid)}:{amt:tp.amt,paid:!!tp.paid};
    delete db.pay[k][id];
  }
  if(db.done[k])delete db.done[k][id];
  var l=db.plans[k]||[],i=l.indexOf(id);if(i>-1)l.splice(i,1);
}
function removeFromDay(id,k){
  var l=db.plans[k]||[],i=l.indexOf(id);
  if(i<0)return false;
  l.splice(i,1);
  var s=byId(id);
  /* A "today only" place that is no longer on any day is deleted, otherwise it would be unreachable. */
  if(s&&s.temp&&!Object.keys(db.plans).some(function(kk){return planOf(kk).indexOf(id)>-1})){
    db.places=db.places.filter(function(p){return p.id!==id});
    if(db.done[k])delete db.done[k][id];
    if(db.pay[k])delete db.pay[k][id];
  }
  return true;
}
$('list').addEventListener('click',function(e){
  var b=e.target.closest('button[data-a]');if(!b||b.disabled)return;
  var a=b.dataset.a,id=Number(b.dataset.id),k=iso(cur),nx;
  if(a==='share'){openShare();return}
  if(a==='pay'){openPay(id);return}
  if(a==='edit'){var s=byId(id);if(s)openDlg(s);return}
  if(a==='tomorrow-all'){
    var rem=dayItems(k).filter(function(s){return !isDone(s.id)});
    if(!rem.length)return;
    if(Date.now()-armAll>=4000){armAll=Date.now();render();setTimeout(function(){if(armAll&&Date.now()-armAll>=4000){armAll=0;render()}},4100);return}
    armAll=0;nx=addDays(cur,1);
    rem.forEach(function(s){pushToTomorrow(s.id,k,iso(nx))});
    save();render();toast(rem.length+' dërgesa u shtynë për nesër ('+dayLabel(nx)+')');return;
  }
  if(a==='tomorrow'){nx=addDays(cur,1);pushToTomorrow(id,k,iso(nx));save();render();toast('U shty për nesër ('+dayLabel(nx)+')');return}
  if(a==='done'){var d=db.done[k]=db.done[k]||{};if(d[id])delete d[id];else d[id]=Date.now()}
  else if(a==='addday'){var l=planFor(k);if(l.indexOf(id)<0)l.push(id)}
  else if(a==='rm'){if(!removeFromDay(id,k)){render();return}}
  else return;
  save();render();
});
$('prev').onclick=function(){cur=addDays(cur,-1);armAll=0;render()};
$('next').onclick=function(){cur=addDays(cur,1);armAll=0;render()};
$('t1').onclick=function(){tab=1;render()};
$('t2').onclick=function(){tab=2;render()};
$('sq').addEventListener('input',function(){q=this.value;render()});
$('add').onclick=function(){if(tab===1)openPick();else{addAfter=false;openDlg(null)}};

/* ===== Pick places for the day ===== */
function openPick(){
  sel={};['tp-n','tp-a','tp-l','pk-q'].forEach(function(i){$(i).value=''});
  $('tp-s').textContent='';$('tp-s').className='hint';
  $('pk-t').textContent='Zgjidh vendet për '+dayLabel(cur);

/* ===== Google Maps link / coordinate parsing ===== */
function readPos(t){
  t=String(t||'').trim();if(!t)return null;
  var u=t;try{u=decodeURIComponent(t.replace(/\+/g,' '))}catch(e){}
  var dm=u.match(/(\d+)°\s*(\d+)['′]\s*([\d.]+)["″]?\s*([NS])[,\s]+(\d+)°\s*(\d+)['′]\s*([\d.]+)["″]?\s*([EW])/i);
  var m=dm?[0,(dm[4].toUpperCase()==='S'?-1:1)*(+dm[1]+dm[2]/60+dm[3]/3600),(dm[8].toUpperCase()==='W'?-1:1)*(+dm[5]+dm[6]/60+dm[7]/3600)]:null;
  /* Explicit positions first; "@lat,lng" is only the map's viewport centre, so it is the last resort. */
  m=m||u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)
     ||u.match(/[?&](?:q|query|ll|destination|daddr)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)
     ||u.match(/\/maps\/(?:place|search)\/(-?\d+\.\d+),\s*(-?\d+\.\d+)/)
     ||u.match(/^\s*(-?\d{1,3}\.\d+)\s*[,;]?\s*(-?\d{1,3}\.\d+)\s*$/)
     ||u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if(!m)return /goo\.gl|maps\.app/i.test(t)?'short':null;
  var lat=+m[1],lng=+m[2];
  if(!(Math.abs(lat)<=90&&Math.abs(lng)<=180))return null;
  var p=u.match(/\/maps\/place\/([^\/@?]+)/);
  return {lat:lat,lng:lng,txt:p&&!/^-?\d+\.\d+,/.test(p[1].trim())?p[1].trim():''};
}

  var rem=pts.filter(function(p){return !p.d}).map(function(p){return p.s});
  if(!rem.length)return;
  var line=[start].concat(rem,[DEPOT]),key=line.map(function(s){return s.lat+','+s.lng}).join(';');
  var sty={color:'#323e49',weight:4,opacity:.85};
  if(routeCache[key]){L.polyline(routeCache[key],sty).addTo(LMlayer);return}
  var straight=L.polyline(line.map(function(s){return [s.lat,s.lng]}),Object.assign({dashArray:'6 6'},sty)).addTo(LMlayer);
  if(!routeReq[key])routeReq[key]=fetch('https://router.project-osrm.org/route/v1/driving/'+line.map(function(s){return s.lng+','+s.lat}).join(';')+'?overview=full&geometries=geojson')

    .finally(function(){delete routeReq[key]});
  routeReq[key].then(function(ll){if(ll&&LMsig===sig){LMlayer.removeLayer(straight);L.polyline(ll,sty).addTo(LMlayer)}}).catch(function(){});
}

/* ===== Shared database (Supabase RPC) =====
   Each device remembers the last server version of every document ("base"). A document whose
   local copy differs from its base has unsent changes: it is retried until the server accepts it,
   and incoming server versions are merged field by field instead of overwriting local edits. */
var LIC='';
var sync={on:false,ready:false,synth:false,base:{p:{},d:{}},sent:{p:{},d:{}},force:false,inflight:{},polling:{},wver:{places:0,days:0},initP:null,outTm:null,retryTm:null,retryN:0,fails:0,warned:false};
function rpc(fn,body){
  var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},15000);
  return fetch(API+fn,{method:'POST',headers:API_HEADERS,body:JSON.stringify(body),signal:ctl.signal})
    .then(function(r){return r.text().then(function(t){
      var o=null;try{o=t?JSON.parse(t):null}catch(e){}
      if(!r.ok){var e1=new Error('HTTP '+r.status);e1.code=r.status;throw e1}
      if(o&&o.ok===false){var e2=new Error(o.err==='perm'?'Nuk ke leje për këtë veprim.':(o.err==='locked'?'Qasja është bllokuar përkohësisht.':String(o.err)));e2.code=o.err;throw e2}
      return o;
    })})
    .finally(function(){clearTimeout(tm)});
}
function rows(o){return o&&Array.isArray(o.rows)?o.rows:[]}
function setSync(t,ok,bad){var e=$('sync');e.textContent=t;e.className=ok?'okk':(bad?'bad':'')}
function saveBase(){store.set(LS_BASE,JSON.stringify({p:sync.base.p,d:sync.base.d,sp:sync.sent.p,sd:sync.sent.d,synth:sync.synth}))}
function loadBase(){
  var b=null;try{b=JSON.parse(store.get(LS_BASE)||'null')}catch(e){}
  if(b&&b.p&&b.d){sync.base={p:b.p,d:b.d};sync.sent={p:b.sp||{},d:b.sd||{}};sync.synth=!!b.synth;return}
  /* First start of this version: assume the cached data is what the server had, so that
     edits made from now on (even offline) are recognised as unsent changes. */
  sync.base={p:{},d:{}};sync.sent={p:{},d:{}};sync.synth=true;
  db.places.forEach(function(p){sync.base.p[p.id]=canon(normPlace(p))});
  dayKeys().forEach(function(k){var v=dayDoc(k);if(!isEmptyDay(v))sync.base.d[k]=canon(v)});

}
function sentOr(t,id){var s=sync.sent[t][id];return s!==undefined?s:sync.base[t][id]}
function pending(){

  db.places.forEach(function(p){seen[p.id]=1;if(canon(normPlace(p))!==sentOr('p',p.id))out.push({key:'p:'+p.id,coll:'places',id:String(p.id)})});
  Object.keys(sync.base.p).forEach(function(id){if(!seen[id])out.push({key:'p:'+id,coll:'places',id:id,del:true})});
  dayKeys().forEach(function(k){
    var v=normDay(dayDoc(k)),b=sentOr('d',k);
    if(b===undefined?!isEmptyDay(v):canon(v)!==b)out.push({key:'d:'+k,coll:'days',id:k});

}
function merge3(b,l,s){

    var lv=l?l[k]:undefined,bv=b?b[k]:undefined,v=canon(lv)!==canon(bv)?lv:(s?s[k]:undefined);

/* Three-way merge of one document: unchanged locally -> take server; unchanged on the server ->

function resolve(bj,l,s,lj,sj,mergeFn){

}
/* A write is confirmed only when a later read returns exactly what was sent. If another device
   overwrote it meanwhile, the base stays at the old version and the 3-way merge re-applies our change. */
function confirmSent(t,id,sj){var sn=sync.sent[t][id];if(sn===undefined)return;if(sj===sn)sync.base[t][id]=sj;delete sync.sent[t][id]}
function applyPlaces(list){
  var base=sync.base.p,srv={},loc={},next=[],changed=false;
  list.forEach(function(r){var p=r&&normPlace(r.data);if(p&&String(p.id)===String(r.id))srv[p.id]=p});
  db.places.forEach(function(p){loc[p.id]=normPlace(p)});
  uniq(db.places.map(function(p){return String(p.id)}).concat(Object.keys(srv),Object.keys(base))).forEach(function(id){
    var s=srv[id],l=loc[id],sj=canon(s),lj=canon(l);
    confirmSent('p',id,sj);
    var r=resolve(base[id],l,s,lj,sj,function(b,l2,s2){return normPlace(merge3(b,l2,s2))});
    if(canon(r)!==lj)changed=true;
    if(sj===undefined)delete base[id];else base[id]=sj;
    if(r)next.push(r);
  });
  db.places=next;
  return changed;
}
function applyDays(list){
  var base=sync.base.d,srv={},changed=false;
  list.forEach(function(r){if(r&&isDayKey(String(r.id)))srv[r.id]=normDay(r.data)});
  uniq(dayKeys().concat(Object.keys(srv),Object.keys(base))).forEach(function(k){
    var s=srv[k],has=db.plans[k]||db.done[k]||db.pay[k],l=has?normDay(dayDoc(k)):undefined,sj=canon(s),lj=canon(l);
    confirmSent('d',k,sj);
    if(l&&base[k]===undefined&&isEmptyDay(l)){l=undefined;lj=undefined}
    /* Days are never deleted locally on purpose: a missing local copy means "unchanged". */
    if(!l&&base[k]!==undefined){l=JSON.parse(base[k]);lj=base[k]}
    var r=resolve(base[k],l,s,lj,sj,function(b,l2,s2){b=b||{ids:[],done:{},pay:{}};return normDay({ids:mergeIds(b.ids,l2.ids,s2.ids),done:merge3(b.done,l2.done,s2.done),pay:merge3(b.pay,l2.pay,s2.pay)})});
    if(canon(r)!==lj)changed=true;
    if(sj===undefined)delete base[k];else base[k]=sj;
    setDay(k,r);
  });
  return changed;
}
function initialPull(){
  if(sync.initP)return sync.initP;
  sync.initP=Promise.all([rpc('kv_list',{lic:LIC,coll:'places'}),rpc('kv_list',{lic:LIC,coll:'days'})]).then(function(res){
    var rp=rows(res[0]),rd=rows(res[1]);
    /* Empty shared database and local data that was never uploaded: upload it (one-time import). */
    if(sync.synth&&!rp.length&&!rd.length&&db.places.length&&!store.get(LS_IMP)){sync.base={p:{},d:{}};store.set(LS_IMP,'1')}
    sync.synth=false;
    applyPlaces(rp);applyDays(rd);saveBase();persist();
    sync.ready=true;render();
    if(pending().length)syncOut();else netOk();
  },function(e){if(e&&e.code==='license'){revoked();return}netFail(e,false)})
  .finally(function(){sync.initP=null});
  return sync.initP;
}
function pull(coll){
  if(sync.polling[coll])return sync.polling[coll];
  var v=sync.wver[coll],pre=coll==='places'?'p:':'d:';
  var pr=rpc('kv_list',{lic:LIC,coll:coll}).then(function(o){
    /* A write started or finished meanwhile: this answer may predate it, so ignore it. */
    if(sync.wver[coll]!==v||Object.keys(sync.inflight).some(function(k){return k.indexOf(pre)===0}))return false;
    var changed=coll==='places'?applyPlaces(rows(o)):applyDays(rows(o));
    saveBase();
    if(changed){persist();render()}
    if(pending().some(function(x){return !sync.inflight[x.key]})){if(!sync.retryTm)syncOut()}else netOk();
    return true;
  },function(e){if(e&&e.code==='license'){revoked();return}netFail(e,false);throw e})
  .finally(function(){delete sync.polling[coll]});
  sync.polling[coll]=pr;
  return pr;
}
/* force: a user action (tries even while waiting for a retry). */
function syncOut(force){if(!sync.on)return;if(force)sync.force=true;clearTimeout(sync.outTm);sync.outTm=setTimeout(flush,300)}
function flush(){
  if(!sync.ready){initialPull();return}
  if(sync.retryTm&&!sync.force)return;
  sync.force=false;
  var todo=pending().filter(function(x){return !sync.inflight[x.key]});
  if(!todo.length){netOk();return}
  /* Read the latest server state first, so concurrent edits from other devices are merged in. */
  var colls=uniq(todo.map(function(x){return x.coll}));
  Promise.all(colls.map(function(c){return pull(c).then(function(ok){return ok},function(){return null})})).then(function(res){
    /* Only write collections whose latest server state was merged in this round. A failed read waits
       for the retry; an ignored one (write in flight) is redone when that write finishes. */
    var okc=colls.filter(function(c,i){return res[i]===true});
    if(res.some(function(r){return r===null}))retryLater();
    pending().filter(function(x){return !sync.inflight[x.key]&&okc.indexOf(x.coll)>-1}).forEach(write);
  });
}
function write(x){
  var isP=x.coll==='places',bm=isP?sync.base.p:sync.base.d,j=null;
  if(!x.del){var v=isP?byId(x.id):dayDoc(x.id);if(!v)return;j=canon(isP?normPlace(v):normDay(v))}
  sync.inflight[x.key]=1;sync.wver[x.coll]++;
  (x.del?rpc('kv_del',{lic:LIC,coll:x.coll,kid:x.id}):rpc('kv_set',{lic:LIC,coll:x.coll,kid:x.id,d:JSON.parse(j)}))
  .then(function(){
    var sm=isP?sync.sent.p:sync.sent.d;
    if(x.del){delete bm[x.id];delete sm[x.id]}else sm[x.id]=j;
    saveBase();sync.retryN=0;
  },function(e){
    if(e&&e.code==='license'){revoked();return}
    if(e&&e.code==='perm'){rejectWrite(x);return}
    netFail(e,true);retryLater();
  })
  .then(function(){delete sync.inflight[x.key];sync.wver[x.coll]++;if(!sync.retryTm)syncOut()});
}
/* The server refused the change (no permission): go back to the server's version. */
function rejectWrite(x){
  var bj=x.coll==='places'?sync.base.p[x.id]:sync.base.d[x.id];
  if(x.coll==='places'){
    db.places=db.places.filter(function(p){return String(p.id)!==x.id});
    if(bj)db.places.push(JSON.parse(bj));
    else{var id=Number(x.id);Object.keys(db.plans).forEach(function(k){var l=db.plans[k],i=l.indexOf(id);if(i>-1)l.splice(i,1);if(db.done[k])delete db.done[k][id];if(db.pay[k])delete db.pay[k][id]})}
  }else setDay(x.id,bj?JSON.parse(bj):undefined);
  delete (x.coll==='places'?sync.sent.p:sync.sent.d)[x.id];
  save();render();toast('Nuk ke leje për këtë ndryshim. U kthye gjendja e mëparshme.');
}
function retryLater(){
  if(sync.retryTm)return;
  var ms=Math.min(30000,2000*Math.pow(2,sync.retryN++));
  sync.retryTm=setTimeout(function(){sync.retryTm=null;syncOut()},ms);
}
function netOk(){
  sync.fails=0;
  if(!sync.ready||sync.retryTm||pending().length)return;
  sync.warned=false;setSync('● Sinkronizuar me të gjithë përdoruesit',true);
}
function netFail(e,isWrite){
  sync.fails++;
  var why=!e||!e.code?'pa internet':(e.code==='locked'?'qasja është bllokuar përkohësisht':String(e.code));
  if(isWrite){
    setSync('⚠ Ndryshimet nuk janë dërguar ende ('+why+'). Ruhen në këtë pajisje dhe dërgohen automatikisht.',false,true);
    if(!sync.warned){sync.warned=true;toast('Pa lidhje: ndryshimet dërgohen kur të ketë internet.')}
  }else if(sync.fails>=2||!sync.ready){
    setSync('⚠ Pa lidhje me databazën ('+why+'). Të dhënat mund të mos jenë të fundit.',false,true);
  }
}
function startSync(){
  sync.on=true;
  setSync('Po lidhem me databazën…');
  initialPull();
  setInterval(function(){
    if(document.hidden)return;
    if(!sync.ready){initialPull();return}
    pull('places').catch(function(){});pull('days').catch(function(){});
  },5000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&sync.ready){pull('places').catch(function(){});pull('days').catch(function(){})}});
  window.addEventListener('online',function(){clearTimeout(sync.retryTm);sync.retryTm=null;sync.retryN=0;syncOut()});
}

/* ===== License gate ===== */
function checkLicense(c){
  var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},15000);
  return fetch(API+'login',{method:'POST',headers:API_HEADERS,body:JSON.stringify({lic:c}),signal:ctl.signal})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .finally(function(){clearTimeout(tm)});
}
function revoked(){store.del(LK);location.reload()}
/* Local data belongs to one license; a different license starts from an empty cache. */
function adoptCache(c){
  var h=hash(c),o=store.get(LS_OWNER);
  /* No owner recorded (data left by an older version after logout) is treated as foreign too. */
  if((o&&o!==h)||(!o&&db.places.length)){db=emptyDb();[LS_DB,LS_BASE,LS_IMP].forEach(store.del);loadBase()}
  store.set(LS_OWNER,h);
}
function applyRole(r){store.set(RK,r||'driver');document.body.classList.toggle('driver',r!=='admin'&&r!=='manager');document.body.classList.toggle('mgr',r==='manager')}
var started=false;
function startApp(){if(started)return;started=true;render();startSync()}
function setInert(on){Array.prototype.forEach.call(document.body.children,function(el){if(el.id!=='gate')el.inert=on})}
function showGate(msg){
  var g=$('gate');
  if(!g){
    g=document.createElement('div');g.id='gate';g.setAttribute('role','dialog');g.setAttribute('aria-modal','true');g.setAttribute('aria-labelledby','g-title');
    g.innerHTML='<div class="g-box"><svg class="logo" viewBox="0 0 597 106" role="img" aria-label="Antracit"><use href="#lg-full"/></svg><h1 id="g-title">Dërgesat e ditës</h1><p>Shkruaj kodin e licencës. Kërkohet vetëm herën e parë.</p><input id="gcode" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX" aria-label="Kodi i licencës"><button id="gbtn" type="button">Hap</button><div id="gmsg" role="alert"></div><div class="g-foot">Antracit · Prizren</div></div>';
    document.body.appendChild(g);setInert(true);
    var busy=false;
    var go=function(){
      var c=$('gcode').value.trim();
      if(!c||busy)return;
      busy=true;$('gbtn').disabled=true;$('gmsg').textContent='Po kontrolloj…';
      checkLicense(c).then(function(o){
        if(!o||!o.ok){$('gmsg').textContent=o&&o.err==='locked'?'Shumë tentativa të gabuara. Qasja u bllokua përkohësisht, provo më vonë.':(o&&o.ok===false?'Kodi nuk është i saktë.':'Gabim në server. Provo përsëri.');return}
        adoptCache(c);store.set(LK,c);LIC=c;applyRole(o.role);
        g.remove();setInert(false);startApp();
      }).catch(function(){$('gmsg').textContent='Nuk ka internet. Provo përsëri.'})
      .finally(function(){busy=false;var b=$('gbtn');if(b)b.disabled=false});
    };
    $('gbtn').onclick=go;
    $('gcode').onkeydown=function(e){if(e.key==='Enter')go()};
    setTimeout(function(){var i=$('gcode');if(i)i.focus()},60);
  }
  if(msg)$('gmsg').textContent=msg;
}
$('dil').onclick=function(){
  var n=sync.on?pending().length:0;
  if(!confirm(n?'Ke '+n+' ndryshime që nuk janë dërguar ende dhe do të humbasin. Të dalësh gjithsesi?':'Të dalësh nga licenca? Do të të duhet kodi përsëri për të hyrë.'))return;
  /* Logging out also removes the cached customer data from this device. */
  [LK,RK,LS_DB,LS_BASE,LS_IMP,LS_OWNER].forEach(store.del);
  location.reload();
};

/* A PWA left open overnight jumps to the new day when it comes back. */
document.addEventListener('visibilitychange',function(){
  if(document.hidden)return;
  var t=iso(new Date());
  if(t!==lastToday){if(iso(cur)===lastToday)cur=noon(new Date());lastToday=t;if(started)render()}
});
window.addEventListener('online',function(){if(started&&tab===1&&$('lmap')&&typeof L==='undefined')initMap()});

/* ===== Start ===== */
loadBase();
(function(){
  var c=store.get(LK)||'';
  if(!c){showGate();return}
  LIC=c;
  if(!store.get(LS_OWNER))store.set(LS_OWNER,hash(c)); /* a cache from an older version belongs to the stored license */
  checkLicense(c).then(function(o){
    if(o&&o.ok){adoptCache(c);applyRole(o.role);startApp()}
    else if(o&&o.err==='locked')showGate('Qasja është bllokuar përkohësisht. Provo më vonë.');
    else if(o&&o.ok===false){store.del(LK);showGate('Kodi nuk është më i vlefshëm.')}
    else throw new Error('unexpected answer');
  }).catch(function(){applyRole(store.get(RK)||'driver');startApp()});
})();
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.warn('Service worker:',e)})});
</script>
